# Yazi configuration
# Docs: https://yazi-rs.github.io/docs/configuration/yazi

# --- Sample placeholders (commented) ---
# [mgr]
# ratio = [1, 4, 3]
# sort_by = "natural"
# show_hidden = false

# [preview]
# wrap = "no"
# tab_size = 4

# [tasks]
# micro_workers = 10
# macro_workers = 25

# [input]
# cursor_blink = true

[opener]
edit = [
  { run = "nvim %s", block = true, desc = "Neovim" },
]

vscode = [
  { run = "code --wait %s", block = true, desc = "VS Code" },
]

[open]
prepend_rules = [
  { url = "*.ipynb", use = "vscode" },
]
